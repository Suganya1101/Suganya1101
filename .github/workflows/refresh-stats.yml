name: refresh stats

on:
  schedule:
    - cron: "17 5 * * *"   # daily, off the hour to avoid GitHub's traffic spike
  workflow_dispatch:        # lets you trigger it manually from the Actions tab

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate stats + portrait
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_LOGIN: ${{ github.repository_owner }}
        run: python3 scripts/generate.py

      - name: Commit if changed
        run: |
          FILES="stats.svg streak.svg languages.svg year.svg portrait.svg README.md"
          if [ -z "$(git status --porcelain -- $FILES)" ]; then
            echo "Nothing changed, skipping commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- $FILES
          git commit -m "chore: refresh generated stats"
          git push
